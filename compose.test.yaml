# Local validation only: no credentials, no Supabase, no persistent data.
services:
  postgres:
    profiles: [persistent]
  backend:
    build:
      target: memory-test
    image: ${COMPOSE_PROJECT_NAME:-wordle}-backend:v1-memory-test
    environment: !reset {}
    depends_on: !reset {}
  frontend:
    networks:
      - default
      - ingress
networks:
  default:
    internal: true
  # A non-internal network is required for Docker Desktop host port publishing.
  # Only Nginx joins it; the backend stays exclusively on the internal network.
  ingress:
    driver: bridge
