name: Wordle CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Tests / isolated backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing locked backend dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r backend/requirements.lock
      - name: Run unittest discovery with external access blocked
        # Equivalent discovery to python -m unittest discover -s backend/tests -v.
        # Guards cover the whole suite, including imports; HTTP uses MemoryDB.
        run: |
          python - <<'PY'
          import socket
          import unittest
          from unittest.mock import patch

          original_connect = socket.socket.connect

          def loopback_only(sock, address):
              if isinstance(address, tuple) and address[0] in ("127.0.0.1", "::1"):
                  return original_connect(sock, address)
              raise AssertionError("External network forbidden during tests")

          with patch("socket.socket.connect", new=loopback_only), patch(
              "socket.socket.connect_ex", side_effect=AssertionError("External network forbidden")
          ), patch("socket.getaddrinfo", side_effect=AssertionError("DNS forbidden")), patch(
              "dotenv.load_dotenv", side_effect=AssertionError(".env loading forbidden")
          ):
              suite = unittest.defaultTestLoader.discover("backend/tests")
              result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun == 0 or result.skipped or not result.wasSuccessful():
              raise SystemExit(1)
          PY

  frontend-build:
    name: Build / frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: /api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  docker-build:
    name: Build / Docker images (no push)
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build backend production runtime
        run: docker build --target runtime --tag wordle-backend:ci backend
      - name: Build frontend runtime
        run: docker build --tag wordle-frontend:ci frontend

  kubernetes-validation:
    name: Infrastructure / Kustomize rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Kubernetes files in checkout
        # These files are currently local/untracked. Publish them separately
        # after review; do not silently skip infrastructure validation.
        run: |
          for file in kustomization.yaml namespace.yaml backend.yaml frontend.yaml nginx.conf; do
            if ! git ls-files --error-unmatch "k8s/local/$file" > /dev/null 2>&1; then
              echo "::error::Missing versioned dependency: k8s/local/$file. Review and version the local Kubernetes manifests separately."
              exit 1
            fi
          done
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1
      - name: Render manifests without a cluster
        # Parses Kustomize inputs and checks referenced resources/ConfigMap files.
        # Does not perform API schema validation, admission or a deployment.
        run: kubectl kustomize k8s/local > /dev/null
