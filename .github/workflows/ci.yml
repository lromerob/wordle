name: Wordle CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Tests / isolated backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      WORDLE_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing locked backend dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r backend/requirements.lock
      - name: Run unittest discovery with external access blocked
        # Separate discovery: 55 backend tests and nine CORS regressions; each runs once.
        # Guards cover the whole suite, including imports; HTTP uses MemoryDB.
        run: |
          python - <<'PY'
          import socket
          import unittest
          from unittest.mock import patch

          original_connect = socket.socket.connect

          def loopback_only(sock, address):
              if isinstance(address, tuple) and address[0] in ("127.0.0.1", "::1"):
                  return original_connect(sock, address)
              raise AssertionError("External network forbidden during tests")

          with patch("socket.socket.connect", new=loopback_only), patch(
              "socket.socket.connect_ex", side_effect=AssertionError("External network forbidden")
          ), patch("socket.getaddrinfo", side_effect=AssertionError("DNS forbidden")), patch(
              "dotenv.load_dotenv", side_effect=AssertionError(".env loading forbidden")
          ), patch("psycopg.AsyncConnection.connect", side_effect=AssertionError("Native DB forbidden")):
              for directory, expected_count in (("backend/tests", 55), ("backend/cors_tests", 9)):
                  # A fresh loader per directory avoids reusing discovery's top-level path.
                  suite = unittest.TestLoader().discover(directory)
                  result = unittest.TextTestRunner(verbosity=2).run(suite)
                  if result.testsRun != expected_count or result.skipped or not result.wasSuccessful():
                      raise SystemExit(1)
          PY
      - name: Test optional telemetry adapter offline
        run: python -B k8s/observability/test_telemetry.py


  postgres-integration:
    name: Integration / real PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: pg07_ci
          POSTGRES_USER: pg04_owner
          # Public, disposable CI credential only; never use for an actual environment.
          POSTGRES_PASSWORD: pg07-disposable-ci-only
        options: >-
          --label wordle.pg07=ci
          --publish 127.0.0.1::5432
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=256m
          --tmpfs /var/run/postgresql:rw,noexec,nosuid,size=16m
          --memory 512m --cpus 1
          --health-cmd "pg_isready -h 127.0.0.1 -U pg04_owner -d pg07_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing locked backend dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r backend/requirements.lock
      - name: Initialize empty database and run eleven real PG-04 tests
        # Service ID is passed as data, not interpolated into shell source.
        env:
          PG07_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
          PG07_CI_ADMIN_PASSWORD: pg07-disposable-ci-only
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B backend/integration/run_pg07_ci.py --service-container "$PG07_SERVICE_CONTAINER"

  frontend-build:
    name: Build / frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: /api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing frontend dependencies
        run: npm ci
      - name: Run all twelve frontend tests without omissions
        run: |
          npm test -- --reporter=json --outputFile="$RUNNER_TEMP/wordle-frontend-tests.json"
          node --input-type=module - "$RUNNER_TEMP/wordle-frontend-tests.json" <<'JS'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!report.success || report.numTotalTests !== 12 || report.numPassedTests !== 12 ||
              report.numPendingTests !== 0 || report.numTodoTests !== 0) {
            throw new Error('Expected exactly twelve passing frontend tests without omissions');
          }
          console.log('PASS: 12 frontend tests, zero omissions');
          JS
      - name: Preserve frontend test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wordle-frontend-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wordle-frontend-tests.json
          if-no-files-found: error
          retention-days: 7
      - name: Build frontend
        run: npm run build

  docker-build:
    name: Build / Docker images (no push)
    needs: [backend-tests, postgres-integration, frontend-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build backend production runtime
        run: docker build --target runtime --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag wordle-backend:ci backend
      - name: Build frontend runtime
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag wordle-frontend:ci frontend
      - name: Verify runtime by immutable local image ID and record evidence
        run: |
          python3 scripts/verify_ci_images.py --revision "$GITHUB_SHA" \
            --backend wordle-backend:ci --frontend wordle-frontend:ci \
            --output "$RUNNER_TEMP/wordle-images.json"
      - name: Preserve image evidence (no image publication)
        uses: actions/upload-artifact@v4
        with:
          name: wordle-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wordle-images.json
          if-no-files-found: error
          retention-days: 7

  kubernetes-validation:
    name: Infrastructure / Kustomize rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Kubernetes files in checkout
        # These files are currently local/untracked. Publish them separately
        # after review; do not silently skip infrastructure validation.
        run: |
          for file in kustomization.yaml namespace.yaml backend.yaml frontend.yaml nginx.conf; do
            if ! git ls-files --error-unmatch "k8s/local/$file" > /dev/null 2>&1; then
              echo "::error::Missing versioned dependency: k8s/local/$file. Review and version the local Kubernetes manifests separately."
              exit 1
            fi
          done
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1
      - name: Render manifests without a cluster
        # Parses Kustomize inputs and checks referenced resources/ConfigMap files.
        # Does not perform API schema validation, admission or a deployment.
        run: |
          for profile in local postgres aks demo-kind blue-green observability; do
            kubectl kustomize "k8s/$profile" > /dev/null
          done


  kind-smoke-test:
    name: Integration / ephemeral kind smoke test
    needs: [backend-tests, frontend-build, docker-build, kubernetes-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KIND_CLUSTER_NAME: wordle-ci
      KIND_EXPERIMENTAL_PROVIDER: docker
    steps:
      - name: Set isolated kubeconfig path
        run: echo "KUBECONFIG=$RUNNER_TEMP/wordle-ci.kubeconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install kind 0.33.0 with release checksum
        run: |
          mkdir -p "$RUNNER_TEMP/kind-bin"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/kind-bin/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/kind-bin/kind.sha256sum" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          checksum=$(awk '{print $1}' "$RUNNER_TEMP/kind-bin/kind.sha256sum")
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/kind-bin/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind-bin/kind"
          echo "$RUNNER_TEMP/kind-bin" >> "$GITHUB_PATH"
      - name: Build memory-only backend and frontend images
        # Jobs have separate Docker daemons; rebuild here without a registry.
        run: |
          docker build --target memory-test --tag wordle-backend:v1-kind-memory backend
          docker build --tag wordle-frontend:v1-kind frontend
      - name: Create ephemeral Kubernetes cluster
        # Pin a node image published for kind 0.33.0; kubectl stays on 1.34.
        run: |
          kind create cluster --name "$KIND_CLUSTER_NAME" --config k8s/local/kind.yaml \
            --image kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d \
            --kubeconfig "$KUBECONFIG" --wait 180s
      - name: Load local images into kind
        run: |
          kind load docker-image --name "$KIND_CLUSTER_NAME" \
            wordle-backend:v1-kind-memory wordle-frontend:v1-kind
      - name: Deploy existing memory manifests and wait for readiness
        run: |
          kubectl apply -f k8s/local/namespace.yaml
          kubectl apply --dry-run=server -k k8s/local
          kubectl apply -k k8s/local
          kubectl -n wordle-local rollout status deployment/backend --timeout=180s
          kubectl -n wordle-local rollout status deployment/frontend --timeout=180s
          kubectl -n wordle-local get pods,services
      - name: HTTP smoke test through frontend proxy
        run: |
          kubectl -n wordle-local port-forward --address 127.0.0.1 service/frontend 8080:8080 \
            > "$RUNNER_TEMP/wordle-port-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true; wait "$forward_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8080/api/health > /dev/null; then
              break
            fi
            if ! kill -0 "$forward_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/wordle-port-forward.log"
              exit 1
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          # Ignore proxy environment variables; every request stays on loopback.
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          base = "http://127.0.0.1:8080"

          def request(path, method="GET", payload=None, expected=200):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(base + path, data=data, method=method,
                                           headers={"Content-Type": "application/json"})
              try:
                  response = opener.open(req, timeout=10)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  assert response.status == expected, (path, response.status, expected)
                  return response.read()

          assert b'<div id="root">' in request("/")
          assert json.loads(request("/api/health")) == {"status": "ok"}
          game = json.loads(request("/api/game/nueva?usuario_id=ci-smoke", "POST"))["partida_id"]
          state = json.loads(request(f"/api/game/{game}"))
          assert "palabra_secreta" not in state["partida"]
          body = {"partida_id": game, "usuario_id": "ci-smoke", "palabra": "ZZZZZ"}
          request("/api/game/intento", "POST", body, expected=400)
          body["palabra"] = "CASAS"
          result = json.loads(request("/api/game/intento", "POST", body))
          assert result["estado"] == "ganada"
          assert result["intentos_usados"] == 1
          assert [item["estado"] for item in result["resultado"]] == ["correcto"] * 5
          print("PASS: frontend, /api/health, creation, hidden answer, invalid guess and victory")
          PY
      - name: Collect diagnostics on failure
        if: ${{ failure() }}
        run: |
          mkdir -p "$RUNNER_TEMP/wordle-diagnostics"
          kubectl get nodes -o wide > "$RUNNER_TEMP/wordle-diagnostics/nodes.txt" 2>&1 || true
          kubectl -n wordle-local get pods,services -o wide > "$RUNNER_TEMP/wordle-diagnostics/resources.txt" 2>&1 || true
          kubectl -n wordle-local describe pods > "$RUNNER_TEMP/wordle-diagnostics/pods.txt" 2>&1 || true
          kubectl -n wordle-local get events --sort-by=.metadata.creationTimestamp > "$RUNNER_TEMP/wordle-diagnostics/events.txt" 2>&1 || true
          for component in backend frontend; do
            kubectl -n wordle-local logs "deployment/$component" --all-containers --tail=200 > "$RUNNER_TEMP/wordle-diagnostics/$component.log" 2>&1 || true
            kubectl -n wordle-local logs "deployment/$component" --all-containers --previous --tail=200 > "$RUNNER_TEMP/wordle-diagnostics/$component-previous.log" 2>&1 || true
          done
          if [ -f "$RUNNER_TEMP/wordle-port-forward.log" ]; then
            cp "$RUNNER_TEMP/wordle-port-forward.log" "$RUNNER_TEMP/wordle-diagnostics/"
          fi
          if command -v kind > /dev/null; then
            kind export logs --name "$KIND_CLUSTER_NAME" "$RUNNER_TEMP/wordle-diagnostics/kind" || true
          fi
      - name: Upload failure diagnostics (no kubeconfig)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: wordle-kind-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wordle-diagnostics/
          retention-days: 7
          if-no-files-found: warn
      - name: Delete only this runner's ephemeral cluster
        if: ${{ always() }}
        run: |
          if command -v kind > /dev/null; then
            kind delete cluster --name "$KIND_CLUSTER_NAME"
          fi


  publish-ghcr:
    name: Publish / GHCR SHA images
    # FIN-CONSOLIDATE explicitly authorizes this project branch in addition to main.
    # Pull requests and manual CI runs never publish; every CI gate must succeed.
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/pg01-07-consolidation') }}
    needs: [backend-tests, postgres-integration, frontend-build, docker-build, kubernetes-validation, kind-smoke-test, terraform-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production images tagged with the full commit SHA
        # Separate runners do not share Docker images. Preserve existing CI jobs;
        # rebuild here rather than adding artifact transfers or registry caches.
        # Never publish the backend memory-test target.
        run: |
          docker build --target runtime \
            --label "org.opencontainers.image.source=https://github.com/lromerob/wordle" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "ghcr.io/lromerob/wordle-backend:$GITHUB_SHA" backend
          docker build --target runtime \
            --label "org.opencontainers.image.source=https://github.com/lromerob/wordle" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "ghcr.io/lromerob/wordle-frontend:$GITHUB_SHA" frontend
      - name: Publish both SHA-tagged images
        run: |
          docker push "ghcr.io/lromerob/wordle-backend:$GITHUB_SHA"
          docker push "ghcr.io/lromerob/wordle-frontend:$GITHUB_SHA"


      - name: Recover published images by digest and verify revision
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          sha = os.environ["GITHUB_SHA"]
          refs = {}
          def docker(*args):
              return subprocess.check_output(["docker", *args], text=True).strip()
          for component in ("backend", "frontend"):
              name = "ghcr.io/lromerob/wordle-" + component
              tag = name + ":" + sha
              built_id = docker("image", "inspect", "--format", "{{.Id}}", tag)
              docker("pull", tag)
              digests = json.loads(docker("image", "inspect", "--format", "{{json .RepoDigests}}", tag))
              matching = [d for d in digests if re.fullmatch(re.escape(name) + r"@sha256:[0-9a-f]{64}", d)]
              if len(matching) != 1:
                  raise SystemExit("Expected one registry manifest digest for " + component)
              ref = matching[0]
              docker("pull", ref)
              recovered = docker("image", "inspect", "--format", "{{.Id}}", ref)
              revision = docker("image", "inspect", "--format", '{{index .Config.Labels "org.opencontainers.image.revision"}}', ref)
              if recovered != built_id or revision != sha:
                  raise SystemExit("Registry image does not match built commit: " + component)
              refs[component] = ref
          Path(os.environ["RUNNER_TEMP"], "wordle-ghcr-refs.json").write_text(
              json.dumps({"revision": sha, "images": refs}, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              for component, ref in refs.items():
                  env.write("GHCR_" + component.upper() + "_REF=" + ref + "\n")
          PY
      - name: Verify recovered digest runtimes without network or credentials
        run: |
          python3 scripts/verify_ci_images.py --revision "$GITHUB_SHA" \
            --backend "$GHCR_BACKEND_REF" --frontend "$GHCR_FRONTEND_REF" \
            --output "$RUNNER_TEMP/wordle-ghcr-runtime.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          refs = json.loads((root / "wordle-ghcr-refs.json").read_text())
          runtime = json.loads((root / "wordle-ghcr-runtime.json").read_text())
          runtime["digest_scope"] = "Published GHCR manifest digests, pulled and matched to build IDs and commit revision"
          runtime["registry_references"] = refs["images"]
          (root / "wordle-ghcr-runtime.json").write_text(json.dumps(runtime, indent=2) + "\n")
          for component, ref in refs["images"].items():
              print("::notice title=GHCR " + component + " digest::" + ref)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Verified GHCR images\nCommit: `" + refs["revision"] + "`\n\n")
              for component, ref in refs["images"].items():
                  summary.write("- " + component + ": `" + ref + "` (pulled; runtime HTTP 200 and healthy)\n")
          PY
      - name: Preserve registry digests and runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: wordle-ghcr-images-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wordle-ghcr-refs.json
            ${{ runner.temp }}/wordle-ghcr-runtime.json
          if-no-files-found: error
          retention-days: 7


  terraform-validation:
    name: Infrastructure / Terraform validation (no Azure)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check
      - name: Initialize providers without remote state or Azure credentials
        run: terraform init -backend=false
      - name: Validate Terraform configuration
        run: terraform validate
