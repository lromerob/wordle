name: wordle
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${WORDLE_DB_NAME:-wordle}
      POSTGRES_USER: ${WORDLE_DB_OWNER:-wordle_owner}
      POSTGRES_PASSWORD: ${WORDLE_DB_ADMIN_PASSWORD:-}
      WORDLE_APP_USER: ${WORDLE_DB_USER:-wordle_app}
      WORDLE_APP_PASSWORD: ${WORDLE_DB_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/00-check-config.sh:/docker-entrypoint-initdb.d/00-check-config.sh:ro
      - ./supabase/migrations/20261108000100_initial_wordle.sql:/docker-entrypoint-initdb.d/10-wordle-schema.sql:ro
      - ./docker/postgres/20-demo-words.sql:/docker-entrypoint-initdb.d/20-demo-words.sql:ro
      - ./docker/postgres/30-app-role.sh:/docker-entrypoint-initdb.d/30-app-role.sh:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "PGPASSWORD=\"$$WORDLE_APP_PASSWORD\" psql --host=127.0.0.1 --username=\"$$WORDLE_APP_USER\" --dbname=\"$$POSTGRES_DB\" --no-psqlrc --set=ON_ERROR_STOP=1 --command='SELECT 1 FROM public.palabras LIMIT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    stop_grace_period: 30s
  backend:
    build:
      context: ./backend
      target: runtime
    image: ${COMPOSE_PROJECT_NAME:-wordle}-backend:v1-local
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${WORDLE_DB_NAME:-wordle}
      PGUSER: ${WORDLE_DB_USER:-wordle_app}
      PGPASSWORD: ${WORDLE_DB_PASSWORD:-}
      PGSSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    stop_grace_period: 15s
  frontend:
    networks: [default, ingress]
    build:
      context: ./frontend
    image: ${COMPOSE_PROJECT_NAME:-wordle}-frontend:v1-local
    ports:
      - "127.0.0.1:${WORDLE_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_grace_period: 10s

volumes:
  postgres_data:
networks:
  default:
    internal: true
  ingress:
    driver: bridge
