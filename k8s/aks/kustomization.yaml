apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wordle-demo
resources:
  - ../postgres
  - controller.yaml
  - ingress.yaml
images:
  - name: wordle-backend
    newName: ghcr.io/lromerob/wordle-backend
    digest: sha256:cb070479c18b6c0edbdc469774b55a09f31397809d7449f64f9fd86fbd1b388a
  - name: wordle-frontend
    newName: ghcr.io/lromerob/wordle-frontend
    digest: sha256:411839215543e410458e5de93850f4ad5de16f66b181285b5a055b583821084f
configMapGenerator:
  - name: wordle-pg-config
    behavior: merge
    literals:
      - WORDLE_CORS_ORIGINS=
patches:
  - target:
      kind: Namespace
      name: wordle-pg06
    patch: |-
      - op: replace
        path: /metadata/name
        value: wordle-demo
      - op: replace
        path: /metadata/labels/wordle.environment
        value: private-postgres-demo
      - op: replace
        path: /metadata/labels/pod-security.kubernetes.io~1enforce-version
        value: v1.34
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: managed-csi
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 8Gi
