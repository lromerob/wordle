apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-green
  namespace: wordle-demo
spec:
  template:
    spec:
      containers:
      - name: backend
        command:
        - python
        - -m
        - uvicorn
        - telemetry_app:app
        - --app-dir
        - /opt/telemetry
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --no-access-log
        - --no-proxy-headers
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://collector.wordle-observability:4318
        - name: WORDLE_RELEASE
          value: green
        volumeMounts:
        - name: telemetry
          mountPath: /opt/telemetry
          readOnly: true
      volumes:
      - name: telemetry
        configMap:
          name: wordle-telemetry
