server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
ingester:
  max_block_duration: 1m
compactor:
  compaction:
    block_retention: 30m
storage:
  trace:
    backend: local
    wal:
      path: /data/wal
    local:
      path: /data/blocks
usage_report:
  reporting_enabled: false
