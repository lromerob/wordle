apiVersion: v1
kind: Namespace
metadata:
  name: wordle-observability
  labels:
    wordle.environment: private-observability-demo
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.165.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: otlp
          containerPort: 4318
        - name: metrics
          containerPort: 8889
        - name: health
          containerPort: 13133
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/collector
          readOnly: true
        args:
        - --config=/etc/collector/collector.yaml
        readinessProbe:
          httpGet:
            path: /
            port: health
          periodSeconds: 3
      volumes:
      - name: data
        emptyDir:
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: config
        configMap:
          name: collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: collector
spec:
  type: ClusterIP
  selector:
    app: collector
  ports:
  - name: otlp
    port: 4318
    targetPort: otlp
  - name: metrics
    port: 8889
    targetPort: metrics
  - name: health
    port: 13133
    targetPort: health
---
apiVersion: apps/v1
