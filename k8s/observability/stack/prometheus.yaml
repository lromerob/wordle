global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
- /etc/rules/rules.yaml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: collector
  static_configs:
  - targets:
    - collector:8889
- job_name: wordle
  metrics_path: /metrics
  static_configs:
  - targets:
    - backend-blue.wordle-demo:8000
    - backend-green.wordle-demo:8000
- job_name: node-exporter
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - wordle-observability
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app
    regex: node-exporter
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_number
    regex: '9100'
    action: keep
- job_name: kubelet-cadvisor
  scheme: https
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  kubernetes_sd_configs:
  - role: node
  relabel_configs:
  - target_label: __address__
    replacement: kubernetes.default.svc:443
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: __metrics_path__
    replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
