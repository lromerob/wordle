apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../aks
images:
  - name: ghcr.io/lromerob/wordle-backend
    newName: wordle-fin0507-backend
    newTag: local
  - name: ghcr.io/lromerob/wordle-frontend
    newName: wordle-fin0507-frontend
    newTag: local
  - name: traefik
    newTag: v3.7.17
patches:
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: standard
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 2Gi
