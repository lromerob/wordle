apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          command: null
          env:
            - $patch: replace
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordle-db
                  key: app-password
          envFrom:
            - configMapRef:
                name: wordle-pg-config
          readinessProbe:
            $patch: replace
            exec:
              command: [python, /opt/probes/readiness.py]
            periodSeconds: 10
            timeoutSeconds: 7
            failureThreshold: 1
          volumeMounts:
            - name: readiness
              mountPath: /opt/probes
              readOnly: true
      volumes:
        - name: readiness
          configMap:
            name: wordle-readiness
