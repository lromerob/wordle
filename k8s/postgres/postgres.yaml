apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app: wordle-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: wordle-postgres
  template:
    metadata:
      labels:
        app: wordle-postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.15
          imagePullPolicy: Never
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: wordle-pg-config
                  key: PGDATABASE
            - name: POSTGRES_USER
              value: wordle_owner
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordle-db
                  key: admin-password
            - name: WORDLE_APP_USER
              valueFrom:
                configMapKeyRef:
                  name: wordle-pg-config
                  key: PGUSER
            - name: WORDLE_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordle-db
                  key: app-password
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'PGPASSWORD="$WORDLE_APP_PASSWORD" psql -h 127.0.0.1 -U "$WORDLE_APP_USER" -d "$POSTGRES_DB" --no-psqlrc --set=ON_ERROR_STOP=1 -tAc "SELECT 1 FROM public.palabras LIMIT 1" | grep -qx 1'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: socket
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: socket
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: init
          configMap:
            name: wordle-postgres-init
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
