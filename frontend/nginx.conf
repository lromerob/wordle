worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream wordle_api {
        zone wordle_api 64k;
        server backend:8000 resolve;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 16k;
        add_header X-Content-Type-Options nosniff always;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location = /api { return 308 /api/; }
        # Trailing slash strips /api/: browser /api/game/nueva -> /game/nueva.
        location /api/ {
            proxy_pass http://wordle_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
